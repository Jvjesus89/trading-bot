services:
  trading-bot:
    build: .
    container_name: bot-binance-spot
    restart: unless-stopped
    env_file:
      - .env
    # DNS explícito: o resolver interno do Docker pode falhar (VPN/firewall do
    # host) e derrubar api.binance.com com "Temporary failure in name resolution".
    # Google primário/secundário + Cloudflare como terceiro fallback.
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs
    # Limites de recursos (evita OOM kills em VPS pequenas)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
